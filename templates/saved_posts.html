<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Posts | InstaClone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/custom.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="fa fa-camera-retro me-2"></i> InstaClone
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item">
              <a class="nav-link" href="/social/feed/">Feed</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/social/suggestions/">Suggestions</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/accounts/profile/{{ user.username }}/"
                >Profile</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/posts/saved/">Saved</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/accounts/logout/">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <h2 class="fw-bold mb-4">Saved Posts</h2>
      <div class="row">
        {% for post in posts %}
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm">
            <a
              href="/accounts/profile/{{ post.user.username }}/"
              class="saved-post-link"
            >
              <img
                src="{{ post.image.url }}"
                class="card-img-top"
                alt="Post Image"
              />
            </a>
            <div class="card-body">
              <a
                href="/accounts/profile/{{ post.user.username }}/"
                class="saved-post-link fw-bold"
                >{{ post.user.username }}</a
              >
              <p class="card-text">{{ post.caption }}</p>
            </div>
          </div>
        </div>
        {% empty %}
        <p>You have not saved any posts yet.</p>
        {% endfor %}
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
