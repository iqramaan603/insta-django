<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Post | InstaClone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/custom.css" />
  </head>
  <body style="background: #111; min-height: 100vh; color: #fff">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="fa fa-camera-retro me-2"></i> InstaClone
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item">
              <a class="nav-link" href="/social/feed/">Feed</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/social/suggestions/">Suggestions</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/accounts/profile/{{ user.username }}/"
                >Profile</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/accounts/logout/">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 80vh"
    >
      <div
        class="card p-4 shadow"
        style="
          background: #181818;
          border-radius: 18px;
          max-width: 350px;
          width: 100%;
          text-align: center;
          color: #fff;
        "
      >
        <h2 class="mb-3">Delete Post</h2>
        <p class="mb-3">Are you sure you want to delete this post?</p>
        <img
          src="{{ post.image.url }}"
          class="mb-3 rounded"
          style="max-width: 100%; height: auto; border: 1px solid #222"
        />
        <form method="post" class="d-flex flex-column gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger mb-2">Yes, Delete</button>
          <a href="/social/feed/" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </body>
</html>
