<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post | InstaClone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/custom.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="fa fa-camera-retro me-2"></i> InstaClone
        </a>
      </div>
    </nav>
    <div class="auth-center-box">
      <h2>Create a New Post</h2>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="image" class="form-label">Image</label>
        <input
          type="file"
          class="form-control"
          id="image"
          name="image"
          required
        />
        <label for="caption" class="form-label">Write something</label>
        <textarea
          class="form-control"
          id="caption"
          name="caption"
          rows="2"
        ></textarea>
        <button type="submit" class="btn mt-3">Post</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
